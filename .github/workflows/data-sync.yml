name: Data sync

# snares commits no game data: each Pages deploy bakes it from sc-gamedata-dumps.
# This redeploys daily (skipped when the site already serves the newest tags and
# revisions) and at once when sc-gamedata's `make publish` dispatches it.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: sc-gamedata-dumps tag to pin (blank = newest release per channel)
        type: string
        required: false
      channel:
        description: Channel of that tag
        type: choice
        options: [LIVE, PTU]
        default: LIVE

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ inputs.tag }}
      channel: ${{ inputs.channel }}
      skip-unchanged: ${{ github.event_name == 'schedule' }}
