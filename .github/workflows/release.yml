name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
      # A pull request opened with the workflow token starts no checks, and main requires them.
      - if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # `pr` can come back empty when a release PR is only updated; `prs` holds them all.
          PR: ${{ steps.release.outputs.pr }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          branches=$( { printf '%s' "$PRS" | jq -r '.[]?.headBranchName // empty'; printf '%s' "$PR" | jq -r '.headBranchName // empty'; } 2>/dev/null | sort -u)
          if [ -z "$branches" ]; then
            echo "::notice::release-please reported a PR but no branch; nothing to check."
            exit 0
          fi
          for branch in $branches; do
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          done
